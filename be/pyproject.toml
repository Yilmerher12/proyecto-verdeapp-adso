[project]
name = "verdeapp-backend"
version = "0.1.0"
description = "VerdeApp — backend FastAPI de coordinacion de reciclaje para conjuntos residenciales"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.18.4",
    "bcrypt==4.0.1",
    "cryptography==50.0.0",
    "ecdsa==0.19.2",
    "email-validator==2.3.0",
    "fastapi==0.135.1",
    "passlib[bcrypt]==1.7.4",
    "psycopg2-binary==2.9.11",
    "pydantic==2.12.5",
    "pydantic-settings==2.15.0",
    "pygments==2.20.0",
    "python-jose[cryptography]==3.5.0",
    "python-multipart==0.0.32",
    "requests==2.33.0",
    "resend==2.25.0",
    "slowapi==0.1.9",
    "sqlalchemy==2.0.48",
    "uvicorn[standard]==0.42.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.0.0",
    "ruff==0.15.7",
]
