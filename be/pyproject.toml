[project]
name = "verdeapp-backend"
version = "0.1.0"
description = "VerdeApp — backend FastAPI de coordinacion de reciclaje para conjuntos residenciales"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.20.0",
    "bcrypt==5.0.0",
    "email-validator==2.3.0",
    "fastapi==0.143.0",
    "fpdf2==2.8.9",
    "pillow==13.0.0",
    "psycopg2-binary==2.9.13",
    "pydantic==2.14.1",
    "pydantic-settings==2.15.0",
    "pygments==2.21.0",
    "pyjwt==2.15.1",
    "python-multipart==0.0.32",
    "requests==2.34.2",
    "resend==2.49.1",
    "slowapi==0.1.10",
    "sqlalchemy==2.1.4",
    # ¿Qué? Ya nada en app/ la usa (ver app/utils/ids.py, generar_uuid4 usa
    #       solo la librería estándar) — pero sigue siendo obligatoria: la
    #       migración histórica 00e3bf999d33 (ya aplicada, no se toca) hace
    #       "import uuid_utils" a nivel de módulo, y Alembic necesita poder
    #       IMPORTAR todas las migraciones del historial para construir su
    #       grafo de revisiones, aunque ya estén aplicadas. Sin esta
    #       dependencia, "alembic upgrade/downgrade" falla siempre,
    #       aunque el destino sea una revisión mucho más reciente.
    "uuid-utils==0.17.1",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pypdf==6.21.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.0",
]

# ¿Qué? Cada "uv run pytest" mide la cobertura del código de app/.
# ¿Para qué? Que nadie pueda "olvidar" medirla: el mismo comando de siempre
#           (y el del CI) la calcula y falla si baja del umbral.
# ¿Impacto? Al correr un solo archivo de tests la cobertura sale baja y el
#           comando falla por el umbral — en ese caso agregar --no-cov.
[tool.pytest]
addopts = ["--cov", "--cov-report=term-missing:skip-covered"]

[tool.coverage.run]
source = ["app"]
# ¿Qué? Se excluyen los propios tests y el script de datos de prueba (seed.py).
# ¿Para qué? Los tests no son lógica de negocio: contarlos inflaría el número,
#           y seed.py solo siembra la BD de desarrollo.
omit = ["app/tests/*", "app/seed.py"]

[tool.coverage.report]
# ¿Qué? Umbral mínimo (bootcamp de testing, semana 1: línea base del 6 de
#       octubre de 2026, 96.69% redondeado hacia abajo). Solo se sube.
fail_under = 96

# ¿Qué? Reglas de lint fijadas a mano: las mismas que ruff 0.15 traía por
#       defecto (errores de sintaxis, imports no usados, variables sin definir).
# ¿Para qué? ruff 0.16 amplió su lista por defecto (reglas de estilo como
#           UP, B, I, DTZ) y marcaba cientos de avisos en código que funciona,
#           lo que rompió el PR de Dependabot #445. Sin esta sección, cada
#           versión nueva de ruff puede cambiar qué se revisa sin avisar.
# ¿Impacto? El código no cambia. Para exigir reglas nuevas, agregarlas aquí
#           a "select" en una tarjeta aparte y corregir los avisos que salgan.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
