services:
  verde_db:
    image: postgres:17-alpine
    container_name: verde_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: verde_user
      POSTGRES_PASSWORD: verde_password
      POSTGRES_DB: verdeapp_db
    # ¿Qué? Issue #315 (CN-002/003/004): todos los puertos de este archivo
    #       llevan el prefijo "127.0.0.1:" — solo aceptan conexiones desde
    #       el mismo computador donde corre Docker.
    # ¿Para qué? Sin el prefijo, Docker abre el puerto en TODAS las
    #           direcciones del equipo, incluida la de la wifi: cualquiera
    #           en la misma red podía entrar a Postgres con la contraseña
    #           del README, o leer en Mailpit los enlaces de recuperación.
    # ¿Impacto? Para quien desarrolla no cambia nada — localhost:5433,
    #           :8000, :3000 y :8025 siguen funcionando igual.
    ports:
        - "127.0.0.1:5433:5432"  # antes era 5432:5432
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verde_user -d verdeapp_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - verde_network

  verde_be:
    build:
      context: ./be
      dockerfile: Dockerfile
    container_name: verde_be
    restart: unless-stopped
    env_file:
      - ./be/.env # 🛡️ Lee las variables de forma segura y oculta
    environment:
      # ¿Qué? Sobreescribe el DATABASE_URL de be/.env solo dentro de este contenedor.
      # ¿Para qué? be/.env usa "localhost:5433" a propósito, para que comandos
      #           corridos directo en la máquina (uv run pytest, uv run alembic)
      #           lleguen a Postgres por el puerto que docker-compose expone al
      #           host. Pero "localhost" DENTRO de este contenedor apunta al
      #           propio contenedor del backend, no al de la base de datos — con
      #           ese valor, verde_be nunca lograba conectarse y se reiniciaba
      #           en bucle apenas arrancaba.
      # ¿Impacto? "verde_db" es el nombre del servicio de Postgres — Docker lo
      #           resuelve automáticamente dentro de la red "verde_network", y
      #           "5432" es el puerto interno real (5433 solo existe para fuera).
      #           No afecta be/.env ni los comandos que corres en tu máquina.
      DATABASE_URL: postgresql://verde_user:verde_password@verde_db:5432/verdeapp_db
      # ¿Qué? Mismo motivo que DATABASE_URL arriba — be/.env trae
      #       SMTP_HOST=localhost a propósito para cuando el backend corre
      #       directo en la máquina (uv run uvicorn), pero "localhost"
      #       DENTRO de este contenedor apunta al propio backend, no al de
      #       Mailpit. Sin este override, cualquier envío de correo desde
      #       el backend en Docker fallaba en silencio (intentaba conectar
      #       SMTP contra sí mismo, donde no hay nada escuchando).
      # ¿Impacto? "verde_mailpit" es el nombre del servicio — Docker lo
      #           resuelve dentro de "verde_network", igual que "verde_db".
      SMTP_HOST: verde_mailpit
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # ¿Qué? Guarda las fotos de evidencia de auditorías fuera del contenedor.
      # ¿Para qué? Sin esto, cada "docker compose up --build" crea un contenedor
      #            nuevo desde cero y las fotos ya subidas se pierden para siempre.
      # ¿Impacto? Las fotos ahora sobreviven a reconstrucciones del contenedor,
      #           igual que "db_data" ya protege a la base de datos.
      - be_uploads:/app/app/uploads
    depends_on:
      verde_db:
        condition: service_healthy
    networks:
      - verde_network

  verde_fe:
    build:
      context: ./fe
      dockerfile: Dockerfile
    container_name: verde_fe
    restart: unless-stopped
    env_file:
      - ./fe/.env # 🛡️ Lee las variables de forma segura y oculta
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - verde_be
    networks:
      - verde_network

  verde_mailpit:
    image: axllent/mailpit:v1.31.0
    container_name: verde_mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    networks:
      - verde_network

networks:
  verde_network:
    driver: bridge

volumes:
  db_data:
  be_uploads: