<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    
    <!-- ¿Qué? Símbolo de VerdeApp en SVG (antes un PNG de 46 KB con degradados).
         ¿Para qué? Se ve nítido en cualquier tamaño de pestaña.
         ¿Impacto? El propio SVG trae un @media (prefers-color-scheme: dark):
         verde bosque en pestañas claras y verde claro en pestañas oscuras,
         así no desaparece en ninguna de las dos. -->
    <link rel="icon" type="image/svg+xml" href="/logos/favicon.svg" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="VerdeApp — Plataforma de reciclaje inteligente para Bogotá" />
    <title>VerdeApp | Login</title>

    <script>
      // ¿Qué? Decide el tema (claro/oscuro) y lo aplica al <html> ANTES de
      //       que cargue React — de forma síncrona, bloqueando el pintado.
      // ¿Para qué? ThemeToggle.tsx solo agrega la clase "dark" dentro de un
      //           useEffect, que corre DESPUÉS de que el navegador ya pintó
      //           la página una vez — eso causaba un "flash": se veía en
      //           claro por una fracción de segundo y luego saltaba a oscuro.
      // ¿Impacto? Mismo criterio que useTheme() en ThemeToggle.tsx (primero
      //           localStorage, si no hay nada, la preferencia del sistema
      //           operativo) — evaluado antes del primer pintado, así el
      //           <html> ya nace con la clase correcta y no hay salto visual.
      (function () {
        var stored = localStorage.getItem("theme");
        var isDark = stored
          ? stored === "dark"
          : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (isDark) document.documentElement.classList.add("dark");
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
