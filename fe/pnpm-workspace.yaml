allowBuilds:
  core-js: true
  esbuild: true

# ¿Qué? Fuerza versiones específicas de dependencias indirectas (las que trae
#       otro paquete por dentro, no las que instalamos nosotros directamente).
# ¿Para qué? Parchar vulnerabilidades conocidas en esas dependencias indirectas
#            sin depender de que el paquete que las trae actualice primero.
# ¿Impacto? Antes vivía en package.json bajo "pnpm.overrides", pero desde pnpm
#           v10 ese bloque se ignora en package.json si existe pnpm-workspace.yaml
#           — debe estar aquí. Por eso 4 de estas 12 reglas nunca se aplicaron
#           de verdad (dompurify, js-yaml, undici, un rango de brace-expansion).
overrides:
  rollup@<4.59.0: 4.59.0
  flatted@<3.4.2: 3.4.2
  minimatch@<3.1.4: 3.1.4
  minimatch@>=9.0.0 <9.0.7: 9.0.7
  brace-expansion@<1.1.13: 1.1.13
  brace-expansion@>=2.0.0 <2.0.3: 2.0.3
  brace-expansion@>=5.0.0 <5.0.6: 5.0.6
  picomatch@>=4.0.0 <4.0.4: 4.0.4
  ajv@<6.14.0: 6.14.0
  undici: 7.28.0
  dompurify: 3.4.14
  js-yaml: 4.3.2
