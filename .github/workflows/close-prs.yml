name: Auto-close PRs

# ¿Qué? "pull_request_target" corre con los permisos y secretos de ESTE
#       repositorio (no los del fork que abrió el PR) — por eso este workflow
#       puede comentar y cerrar el PR con permiso de escritura.
# ¿Para qué? Documentar la regla permanente: este archivo es seguro HOY porque
#           nunca descarga ni ejecuta el código del Pull Request — solo escribe
#           un comentario fijo y cambia el estado del PR.
# ¿Impacto? REGLA QUE NUNCA SE DEBE ROMPER: jamás agregar aquí un paso
#           "actions/checkout" con "ref: github.event.pull_request.head.sha",
#           ni ningún "run:" que ejecute contenido del PR. Si eso pasara, el
#           código de un desconocido correría con el token de escritura de
#           este repositorio — un atacante externo solo necesitaría abrir un
#           PR para explotarlo. Cualquier trabajo que sí necesite el código
#           del PR (tests, build) debe ir en ci.yml, que usa "pull_request"
#           (no "pull_request_target") con permiso de solo lectura.
on:
  pull_request_target:
    types: [opened, reopened]

# Principio de mínimo privilegio: solo los permisos estrictamente necesarios
permissions:
  contents: read
  pull-requests: write

jobs:
  close-pr:
    # Solo se ejecuta si la PR viene de un "fork" (una copia del repo hecha
    # por otra persona) — es decir, alguien de verdad externo al proyecto.
    # Las ramas creadas DENTRO de nuestro propio repositorio (nuestro flujo
    # normal: feat/algo, fix/algo, etc.) tienen el mismo repo de origen y
    # destino, así que esta condición las deja pasar sin cerrarlas.
    if: github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    runs-on: ubuntu-24.04
    steps:
      - name: Cerrar PR automáticamente
        # actions/github-script@v7.1.0
        # SHA pinado para prevenir supply chain attacks (tag mutable → SHA inmutable)
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '⛔ Este repositorio no acepta pull requests externos.\n\nSi tienes una sugerencia o encontraste un error, por favor abre un **Issue**.\n\n_This repository does not accept external pull requests. Please open an Issue instead._'
            });
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              state: 'closed'
            });
